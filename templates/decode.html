{% extends "base.html" %}{% block content %}
<div class="page"><h1>Extract Secret Image</h1><p class="muted">Upload the generated PNG and enter the same password.</p>
<form method="post" enctype="multipart/form-data" class="card form">
<label>Stego image<input type="file" name="stego" accept="image/png,image/*" required></label>
<label>Password<input type="password" name="password" required placeholder="Enter the original password"></label>
<button class="btn" type="submit">Extract & Decrypt</button></form></div>
{% endblock %}
