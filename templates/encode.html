{% extends "base.html" %}{% block content %}
<div class="page"><h1>Hide Secret Image</h1><p class="muted">Choose a cover image and the confidential image to hide.</p>
<form method="post" enctype="multipart/form-data" class="card form">
<label>Cover image<input type="file" name="cover" accept="image/*" required></label>
<label>Secret image<input type="file" name="secret" accept="image/*" required></label>
<label>Password<input type="password" name="password" minlength="6" required placeholder="Enter a strong password"></label>
<button class="btn" type="submit">Encrypt & Hide</button></form></div>
{% endblock %}
